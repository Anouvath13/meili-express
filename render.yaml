services:
  - type: web
    name: meili-express-api
    runtime: node
    plan: free
    region: singapore
    # --include=dev overrides NODE_ENV=production for this install step —
    # the TypeScript build needs devDependencies (typescript, @types/*)
    # even though NODE_ENV=production is set for the app's own runtime logic.
    buildCommand: npm install --include=dev && npm run build -w @meili/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_CUSTOMER_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: CORS_ORIGIN
        value: https://meili-express-web.onrender.com

  - type: web
    name: meili-express-web
    runtime: static
    buildCommand: npm install && npm run build -w @meili/shared && npm run build -w @meili/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://meili-express-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
